<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-label="청아 설아 함께 샘플 이미지">
  <!-- 샘플 — 실제 사진으로 교체 -->
  <rect width="400" height="500" fill="#E4EEF1"/>
  <rect width="400" height="500" fill="url(#paperH)"/>
  <defs>
    <pattern id="paperH" width="24" height="24" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#E4EEF1"/>
      <rect width="12" height="24" fill="#D6E6EA"/>
    </pattern>
  </defs>
  <path d="M 24 130 Q 200 64 376 130" fill="none" stroke="#136B78" stroke-width="2.5" opacity="0.6"/>
  <path d="M 60 152 Q 200 100 340 152" fill="none" stroke="#136B78" stroke-width="1.5" opacity="0.35"/>
  <!-- 좌우 대칭 두 원 -->
  <circle cx="122" cy="250" r="62" fill="#D6E6EA" opacity="0.6" stroke="#136B78" stroke-width="3"/>
  <circle cx="278" cy="250" r="62" fill="#D6E6EA" opacity="0.6" stroke="#136B78" stroke-width="3"/>
  <text x="122" y="264" text-anchor="middle" font-family="serif" font-size="40" fill="#136B78">청아</text>
  <text x="278" y="264" text-anchor="middle" font-family="serif" font-size="40" fill="#136B78">설아</text>
  <!-- 가운데 매듭 -->
  <line x1="200" y1="224" x2="200" y2="276" stroke="#9C7C45" stroke-width="2"/>
  <circle cx="200" cy="250" r="7" fill="none" stroke="#9C7C45" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" letter-spacing="2" fill="#223038" opacity="0.7">우리 곁으로 온 첫 여름</text>
  <text x="200" y="466" text-anchor="middle" font-family="sans-serif" font-size="15" letter-spacing="3" fill="#223038" opacity="0.5">SAMPLE · 샘플</text>
</svg>
